<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a2540">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Hidratación 💧</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #0a2540, #1976d2);
    color: #fff;
    min-height: 100vh;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  h1 { font-size: 1.5rem; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; opacity: 0.75; font-size: 0.85rem; margin-bottom: 16px; }
  .hidden { display: none !important; }
  label { display: block; font-size: 0.85rem; margin: 12px 0 4px; opacity: 0.9; }
  input, select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 1rem;
  }
  input::placeholder { color: rgba(255,255,255,0.5); }
  option { color: #000; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 1rem;
    font-weight: 600;
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.97); }
  .btn-primary {
    width: 100%;
    margin-top: 20px;
    background: #4fc3f7;
    color: #0a2540;
  }
  .btn-water {
    background: rgba(79,195,247,0.25);
    color: #fff;
    border: 1px solid #4fc3f7;
  }
  .btn-reset {
    background: transparent;
    color: #ff8a80;
    font-size: 0.85rem;
    padding: 8px;
  }
  .grid-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .progress-container {
    margin: 20px 0;
    background: rgba(0,0,0,0.25);
    border-radius: 999px;
    height: 30px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4fc3f7, #29b6f6, #0288d1);
    transition: width 0.4s ease;
  }
  .progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .stats { display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 8px; }
  .stat-value { font-weight: 700; color: #4fc3f7; }
  .section { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.15); }
  .section h3 { font-size: 0.95rem; margin-bottom: 8px; opacity: 0.9; }
  .reminder-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .reminder-row input { flex: 1; }
  .badge {
    display: inline-block;
    background: #4fc3f7;
    color: #0a2540;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    margin-left: 6px;
  }
  .install-banner {
    background: #4fc3f7;
    color: #0a2540;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 16px;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 600;
    display: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="app">

  <div id="installBanner" class="install-banner" onclick="instalarApp()">
    📲 Toca aquí para instalar la app en tu teléfono
  </div>

  <!-- PANTALLA 1: CONFIGURACIÓN -->
  <div id="setup">
    <h1>💧 Hidratación</h1>
    <p class="subtitle">Cuéntame sobre ti para calcular tu meta diaria</p>

    <label>Peso (kg)</label>
    <input type="number" id="peso" placeholder="Ej: 70" min="20" max="300" inputmode="decimal">

    <label>Altura (cm)</label>
    <input type="number" id="altura" placeholder="Ej: 175" min="100" max="250" inputmode="numeric">

    <label>Edad</label>
    <input type="number" id="edad" placeholder="Ej: 25" min="10" max="120" inputmode="numeric">

    <label>Nivel de actividad</label>
    <select id="actividad">
      <option value="0">Sedentario (poco ejercicio)</option>
      <option value="350">Moderado (1-3 días/semana)</option>
      <option value="700">Intenso (4+ días/semana)</option>
    </select>

    <button class="btn-primary" onclick="guardarPerfil()">Calcular mi meta 🚀</button>
  </div>

  <!-- PANTALLA 2: APP PRINCIPAL -->
  <div id="main" class="hidden">
    <h1>💧 Hidratación</h1>
    <p class="subtitle">Meta diaria: <span class="badge" id="metaBadge">0 ml</span></p>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
      <div class="progress-text" id="progressText">0 / 0 ml</div>
    </div>

    <div class="stats">
      <div>Hoy: <span class="stat-value" id="consumido">0 ml</span></div>
      <div>Faltan: <span class="stat-value" id="faltante">0 ml</span></div>
    </div>

    <div class="grid-btns">
      <button class="btn-water" onclick="agregarAgua(250)">+ 250 ml 🥛</button>
      <button class="btn-water" onclick="agregarAgua(500)">+ 500 ml 🍶</button>
      <button class="btn-water" onclick="agregarAgua(750)">+ 750 ml 🍾</button>
      <button class="btn-water" onclick="agregarPersonalizado()">+ Personalizado</button>
    </div>

    <div class="section">
      <h3>🔔 Recordatorios</h3>
      <div class="reminder-row">
        <input type="number" id="intervalo" value="60" min="5" max="480" placeholder="Minutos" inputmode="numeric">
        <button class="btn-water" onclick="activarRecordatorios()" id="btnRecordatorio">Activar</button>
      </div>
      <p class="subtitle" id="estadoRecordatorio" style="margin-top:8px;">Desactivado</p>
    </div>

    <div class="section" style="text-align:center;">
      <button class="btn-reset" onclick="reiniciarDia()">Reiniciar día</button>
      <button class="btn-reset" onclick="cambiarPerfil()">Cambiar datos</button>
    </div>
  </div>

</div>

<script>
// ---------- ESTADO ----------
let perfil = JSON.parse(localStorage.getItem('perfilAgua') || 'null');
let estado = JSON.parse(localStorage.getItem('estadoAgua') || 'null');
let intervaloId = null;
let deferredPrompt = null;

const hoy = () => new Date().toISOString().split('T')[0];

// ---------- PWA INSTALL ----------
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').style.display = 'block';
});

function instalarApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    deferredPrompt = null;
    document.getElementById('installBanner').style.display = 'none';
  });
}

// ---------- SERVICE WORKER ----------
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(console.error);
}

// ---------- CONFIGURACIÓN ----------
function guardarPerfil() {
  const peso = parseFloat(document.getElementById('peso').value);
  const altura = parseFloat(document.getElementById('altura').value);
  const edad = parseFloat(document.getElementById('edad').value);
  const actividad = parseFloat(document.getElementById('actividad').value);

  if (!peso || !altura || !edad) {
    alert('Por favor completa todos los campos');
    return;
  }

  let meta = peso * 35 + actividad;
  if (edad > 65) meta += 200;
  if (edad < 18) meta = peso * 40;

  perfil = { peso, altura, edad, actividad, meta: Math.round(meta) };
  localStorage.setItem('perfilAgua', JSON.stringify(perfil));

  iniciarDia();
  mostrarMain();
}

function iniciarDia() {
  const guardado = JSON.parse(localStorage.getItem('estadoAgua') || 'null');
  if (guardado && guardado.fecha === hoy()) {
    estado = guardado;
  } else {
    estado = { fecha: hoy(), consumido: 0 };
    localStorage.setItem('estadoAgua', JSON.stringify(estado));
  }
}

// ---------- UI ----------
function mostrarMain() {
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('metaBadge').textContent = perfil.meta + ' ml';
  actualizarUI();
}

function mostrarSetup() {
  document.getElementById('main').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
}

function actualizarUI() {
  if (!perfil || !estado) return;
  const consumido = estado.consumido;
  const meta = perfil.meta;
  const pct = Math.min(100, (consumido / meta) * 100);

  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent =
    `${consumido} / ${meta} ml (${Math.round(pct)}%)`;
  document.getElementById('consumido').textContent = consumido + ' ml';
  document.getElementById('faltante').textContent = Math.max(0, meta - consumido) + ' ml';
}

// ---------- ACCIONES ----------
function agregarAgua(ml) {
  iniciarDia();
  estado.consumido += ml;
  localStorage.setItem('estadoAgua', JSON.stringify(estado));
  actualizarUI();

  if (navigator.vibrate) navigator.vibrate(30);

  if (estado.consumido >= perfil.meta && estado.consumido - ml < perfil.meta) {
    setTimeout(() => alert('🎉 ¡Felicidades! Alcanzaste tu meta diaria'), 300);
  }
}

function agregarPersonalizado() {
  const ml = prompt('¿Cuántos ml tomaste?');
  if (ml && !isNaN(ml)) agregarAgua(parseInt(ml));
}

function reiniciarDia() {
  if (confirm('¿Reiniciar el contador de hoy?')) {
    estado = { fecha: hoy(), consumido: 0 };
    localStorage.setItem('estadoAgua', JSON.stringify(estado));
    actualizarUI();
  }
}

function cambiarPerfil() {
  mostrarSetup();
  document.getElementById('peso').value = perfil.peso;
  document.getElementById('altura').value = perfil.altura;
  document.getElementById('edad').value = perfil.edad;
  document.getElementById('actividad').value = perfil.actividad;
}

// ---------- RECORDATORIOS ----------
async function activarRecordatorios() {
  if (!('Notification' in window)) {
    alert('Tu navegador no soporta notificaciones');
    return;
  }

  const permiso = await Notification.requestPermission();
  if (permiso !== 'granted') {
    alert('Debes permitir las notificaciones para usar los recordatorios');
    return;
  }

  if (intervaloId) {
    clearInterval(intervaloId);
    intervaloId = null;
    localStorage.removeItem('intervaloAgua');
    document.getElementById('estadoRecordatorio').textContent = 'Desactivado';
    document.getElementById('btnRecordatorio').textContent = 'Activar';
    return;
  }

  const minutos = parseInt(document.getElementById('intervalo').value) || 60;
  const ms = minutos * 60 * 1000;

  intervaloId = setInterval(() => {
    if (Notification.permission === 'granted') {
      new Notification('💧 Hora de tomar agua', {
        body: 'Recuerda hidratarte. Toma un vaso de agua ahora.',
        tag: 'agua-reminder',
        renotify: true,
        requireInteraction: true
      });
    }
  }, ms);

  localStorage.setItem('intervaloAgua', minutos);
  document.getElementById('estadoRecordatorio').textContent =
    `✅ Activo cada ${minutos} minutos`;
  document.getElementById('btnRecordatorio').textContent = 'Desactivar';

  // Notificación inmediata de prueba
  new Notification('💧 Recordatorios activados', {
    body: `Te avisaré cada ${minutos} minutos`,
    tag: 'agua-init'
  });
}

// ---------- INICIO ----------
(function init() {
  if (perfil) {
    iniciarDia();
    mostrarMain();
    const min = localStorage.getItem('intervaloAgua');
    if (min) {
      document.getElementById('intervalo').value = min;
      document.getElementById('estadoRecordatorio').textContent =
        `Recordatorio guardado (cada ${min} min). Pulsa Activar.`;
    }
  }
})();
</script>
</body>
</html>
